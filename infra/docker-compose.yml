name: gsw-mail

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-gsw_mail}
      POSTGRES_USER: ${PG_USER:-gsw_mail}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-gsw_mail} -d ${PG_DATABASE:-gsw_mail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  stalwart:
    image: stalwartlabs/stalwart:v0.16.18
    restart: unless-stopped
    hostname: ${HOSTNAME:-mx1.guidedstepswellness.com}
    environment:
      HOSTNAME: ${HOSTNAME:-mx1.guidedstepswellness.com}
      TZ: ${TZ:-America/Detroit}
      STALWART_PUBLIC_URL: ${STALWART_PUBLIC_URL:-https://mx1.guidedstepswellness.com}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:?set STALWART_RECOVERY_ADMIN in infra/.env}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: 4000
      MAIL_ENGINE: stalwart
      OUTBOUND_RELAY: resend
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      stalwart:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg-data:
  stalwart-etc:
  stalwart-data: