name: Phase 3 Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-production-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production OAuth consent surface
        shell: bash
        env:
          BASE_URL: https://mail.guidedstepswellness.com
        run: |
          set -euo pipefail

          health=$(curl --silent --show-error --output /tmp/health --write-out '%{http_code}' "$BASE_URL/health")
          test "$health" = "200"
          echo "health: $health"

          discovery=$(curl --silent --show-error --output /tmp/discovery --write-out '%{http_code}' "$BASE_URL/api/auth/.well-known/openid-configuration")
          test "$discovery" = "200"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/discovery'))
          scopes = set(data.get('scopes_supported') or [])
          for scope in ('openid', 'profile', 'email'):
              assert scope in scopes, (scope, sorted(scopes))
          print('discovery: 200, openid/profile/email advertised')
          PY

          consent_page=$(curl --silent --show-error --output /tmp/consent --write-out '%{http_code}' "$BASE_URL/oauth/consent?client_id=unknown-phase3-smoke&scope=openid%20email")
          test "$consent_page" = "200"
          grep -q 'id="root"' /tmp/consent
          echo "consent page route: $consent_page"

          consent_post=$(curl --silent --show-error --output /tmp/consent-post --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' --data '{"accept":true,"scope":"openid email"}' \
            "$BASE_URL/api/auth/oauth2/consent")
          case "$consent_post" in 200|201|202|204) echo "unauthenticated consent unexpectedly succeeded"; exit 1;; esac
          echo "unauthenticated consent rejected: $consent_post"

          verifier='phase3-production-smoke-verifier-abcdefghijklmnopqrstuvwxyz0123456789'
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          authorize_headers=$(mktemp)
          authorize_code=$(curl --silent --show-error --dump-header "$authorize_headers" --output /tmp/authorize --write-out '%{http_code}' \
            --get "$BASE_URL/api/auth/oauth2/authorize" \
            --data-urlencode 'response_type=code' \
            --data-urlencode 'client_id=unknown-phase3-smoke' \
            --data-urlencode 'redirect_uri=https://example.com/callback' \
            --data-urlencode 'scope=openid email' \
            --data-urlencode 'state=phase3-smoke' \
            --data-urlencode "code_challenge=$challenge" \
            --data-urlencode 'code_challenge_method=S256')
          if grep -qi '^location: https://example.com/callback' "$authorize_headers"; then
            echo "unknown client was redirected to an unregistered callback"
            exit 1
          fi
          case "$authorize_code" in 200|201|202|204) echo "unknown client authorization unexpectedly succeeded"; exit 1;; esac
          echo "unknown client rejected before callback: $authorize_code"
