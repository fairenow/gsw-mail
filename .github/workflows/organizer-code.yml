name: Organizer verification regression
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/meetings/**'
      - 'apps/api/src/routes/eventLinks.ts'
      - 'apps/api/src/lib/*MeetingOwnerCode.test.ts'
      - '.github/workflows/organizer-code.yml'
  pull_request:
    paths:
      - 'apps/api/src/meetings/**'
      - 'apps/api/src/routes/eventLinks.ts'
      - 'apps/api/src/lib/*MeetingOwnerCode.test.ts'
      - '.github/workflows/organizer-code.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --import tsx --test apps/api/src/lib/nativeMeetingOwnerCode.test.ts apps/api/src/lib/meetingOwnerCode.test.ts apps/api/src/lib/bookingEmail.test.ts
