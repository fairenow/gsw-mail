name: Browser Worker CI

on:
  pull_request:
    paths:
      - 'services/browser-worker/**'
      - '.github/workflows/browser-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/browser-worker/**'
      - '.github/workflows/browser-worker-ci.yml'

jobs:
  build-browser-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npm run build
