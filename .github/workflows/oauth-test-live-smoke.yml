name: OAuth Test Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oauth-test-live-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify OAuth test client deployment
        shell: bash
        env:
          BASE_URL: https://mail.guidedstepswellness.com
        run: |
          set -euo pipefail

          # Give Vercel/Railway a short window to deploy the preceding main commits.
          for attempt in 1 2 3 4 5 6; do
            page_code=$(curl --silent --show-error --output /tmp/oauth-test --write-out '%{http_code}' "$BASE_URL/oauth/test" || true)
            if [ "$page_code" = "200" ] && grep -q 'id="root"' /tmp/oauth-test; then break; fi
            sleep 10
          done
          test "$page_code" = "200"
          grep -q 'id="root"' /tmp/oauth-test
          echo "oauth test page: 200"

          verifier='live-smoke-verifier-abcdefghijklmnopqrstuvwxyz0123456789'
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          for attempt in 1 2 3 4 5 6; do
            headers=$(mktemp)
            authorize_code=$(curl --silent --show-error --dump-header "$headers" --output /tmp/authorize --write-out '%{http_code}' \
              --get "$BASE_URL/api/auth/oauth2/authorize" \
              --data-urlencode 'response_type=code' \
              --data-urlencode 'client_id=gsw-mail-web-oauth-test' \
              --data-urlencode "$BASE_URL/oauth/test/callback" \
              --data-urlencode 'scope=openid profile email' \
              --data-urlencode 'state=live-smoke' \
              --data-urlencode 'nonce=live-smoke-nonce' \
              --data-urlencode "code_challenge=$challenge" \
              --data-urlencode 'code_challenge_method=S256' || true)
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")
            if [ "$authorize_code" = "302" ] && printf '%s' "$location" | grep -q '/sign-in'; then break; fi
            sleep 10
          done

          test "$authorize_code" = "302"
          printf '%s' "$location" | grep -q '/sign-in'
          echo "registered PKCE client reaches GSW sign-in: 302"
